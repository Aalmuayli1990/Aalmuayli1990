name: tasi-filings-ci
on:
  push:
    paths: ["tasi-filings/**", ".github/workflows/tasi-filings-ci.yml"]
  pull_request:
    paths: ["tasi-filings/**", ".github/workflows/tasi-filings-ci.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: MCP client smoke test (no Safari, no local extracts)
        working-directory: tasi-filings
        run: uv run test_tasi_filings.py
